
name: Deploy Build Artifact to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v5

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Install dependencies
      - name: Install Dependencies
        run: npm install

      # Build project
      - name: Build Application
        run: npm run build

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Remove old files from S3 bucket
      - name: Clear Old S3 Files
        run: aws s3 rm s3://${{ secrets.S3_BUCKET }} --recursive

      # Upload new build artifact
      - name: Upload New Build
        run: aws s3 cp dist/ s3://${{ secrets.S3_BUCKET }} --recursive
```
