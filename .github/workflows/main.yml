on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # REMOVE OLD FILES (S3 delete equivalent)
      - name: Clean Old Files from Azure Blob
        run: |
          az storage blob delete-batch \
            --account-name myk \
            --source '$web'

      # UPLOAD NEW FILES
      - name: Upload Website Files
        run: |
          az storage blob upload-batch \
            --account-name myk \
            --destination '$web' \
            --source result-app \
            --overwrite
